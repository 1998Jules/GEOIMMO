{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion | Habitat-TOUT-EN-UN</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
        }
        .login-card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }
        .login-header {
            background: linear-gradient(to right, #4b6cb7, #182848);
            color: white;
            padding: 20px;
            text-align: center;
        }
        .form-control:focus {
            border-color: #4b6cb7;
            box-shadow: 0 0 0 0.25rem rgba(75, 108, 183, 0.25);
        }
        .btn-login {
            background: linear-gradient(to right, #4b6cb7, #182848);
            border: none;
            padding: 10px;
            font-weight: 600;
        }
        .btn-login:hover {
            opacity: 0.9;
        }
        .form-floating label {
            color: #6c757d;
        }
        .alternative-login {
            text-align: center;
            margin: 20px 0;
            position: relative;
        }
        .alternative-login::before, .alternative-login::after {
            content: "";
            flex: 1;
            border-bottom: 1px solid #dee2e6;
            margin: auto 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="login-card card">
                    <div class="login-header">
                        <h2><i class="fas fa-home me-2"></i>Habitat-TOUT-EN-UN</h2>
                        <p class="mb-0">Connectez-vous à votre espace</p>
                    </div>
                    <div class="card-body p-4">
                        <form method="post" class="mt-3">
                            {% csrf_token %}
                            
                            <div class="form-floating mb-3">
                                <input type="text" class="form-control" id="id_username" name="username" placeholder="Nom d'utilisateur" required>
                                <label for="id_username"><i class="fas fa-user me-2"></i>Nom d'utilisateur</label>
                            </div>
                            
                            <div class="form-floating mb-3">
                                <input type="password" class="form-control" id="id_password" name="password" placeholder="Mot de passe" required>
                                <label for="id_password"><i class="fas fa-lock me-2"></i>Mot de passe</label>
                            </div>
                            
                            <div class="d-grid mb-3">
                                <button type="submit" class="btn btn-login btn-primary text-white">
                                    <i class="fas fa-sign-in-alt me-2"></i>Connexion
                                </button>
                            </div>
                            
                            <div class="d-flex justify-content-between">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="rememberMe">
                                    <label class="form-check-label" for="rememberMe">Se souvenir de moi</label>
                                </div>
                                <a href="#" class="text-decoration-none">Mot de passe oublié ?</a>
                            </div>
                        </form>
                        
                        <div class="alternative-login d-flex align-items-center my-4">
                            <span class="px-2">OU</span>
                        </div>
                        
                        <div class="text-center">
                            <p class="mb-0">Pas encore de compte ? 
                                <a href="{% url 'inscription' %}" class="text-decoration-none fw-bold">Inscrivez-vous ici</a>
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
